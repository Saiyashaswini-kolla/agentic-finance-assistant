<!doctype html>
<html><head><meta charset="utf-8"><title>Finance Research Assistant</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}
input,button{font-size:1rem;padding:.5rem}input[type=text]{width:70%}
pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem;border-radius:8px}
</style></head><body>
<h2>Agentic Finance Research Assistant</h2>
<p>Ask a question about the loaded reports, or upload a .txt or .pdf report first.</p>
<input type="file" id="f" accept=".txt,.pdf"><button onclick="up()">Upload</button><br><br>
<input type="text" id="q" placeholder="e.g. What are the risk factors?">
<button onclick="ask()">Research</button>
<pre id="out"></pre>
<script>
async function ask(){
  out.textContent="Working...";
  const r=await fetch("/research",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q.value})});
  const d=await r.json(); out.textContent=d.memo;
}
async function up(){
  const fd=new FormData(); fd.append("file",f.files[0]);
  const r=await fetch("/ingest",{method:"POST",body:fd}); out.textContent=JSON.stringify(await r.json());
}
</script></body></html>
